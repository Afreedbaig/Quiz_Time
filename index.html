<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="stylesheet" href="index.css" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <script src="server.js" type="module" defer></script>
    </head>
    <body>
        <div class="firstcontainer">
            <div id="startscreen" class="maincontainer screen active">
                <h2>Quiz Time!</h2>
                <p>Test your knowledge with these fun questions</p>
                <div class="qcd">
                    <input
                        id="inputnumq"
                        type="number"
                        min="0"
                        max="15"
                        placeholder="number of questions"
                    />
                    <select name="trivia_category" id="cat" class="cat">
                        <option value="any">Any Category</option>
                        <option value="9">General Knowledge</option>
                        <option value="10">Entertainment: Books</option>
                        <option value="11">Entertainment: Film</option>
                        <option value="12">Entertainment: Music</option>
                        <option value="13">
                            Entertainment: Musicals &amp; Theatres
                        </option>
                        <option value="14">Entertainment: Television</option>
                        <option value="15">Entertainment: Video Games</option>
                        <option value="16">Entertainment: Board Games</option>
                        <option value="17">Science &amp; Nature</option>
                        <option value="18">Science: Computers</option>
                        <option value="19">Science: Mathematics</option>
                        <option value="20">Mythology</option>
                        <option value="21">Sports</option>
                        <option value="22">Geography</option>
                        <option value="23">History</option>
                        <option value="24">Politics</option>
                        <option value="25">Art</option>
                        <option value="26">Celebrities</option>
                        <option value="27">Animals</option>
                        <option value="28">Vehicles</option>
                        <option value="29">Entertainment: Comics</option>
                        <option value="30">Science: Gadgets</option>
                        <option value="31">
                            Entertainment: Japanese Anime &amp; Manga
                        </option>
                        <option value="32">
                            Entertainment: Cartoon &amp; Animations
                        </option>
                    </select>
                    <select
                        name="trivia_difficulty"
                        class="form-control"
                        id="diff"
                    >
                        <option value="any">Any Difficulty</option>
                        <option value="easy">Easy</option>
                        <option value="medium">Medium</option>
                        <option value="hard">Hard</option>
                    </select>
                </div>
                <p class="show" id="showp">
                    number of questions cant be <span id="highorlow">.</span>
                </p>
                <button id="tryagain" class="show">Try Again</button>
                <button id="startquiz">Start Quiz</button>
                <p style="margin-top: 20%; display: none" id="wait">
                    Loading please wait......
                </p>
            </div>
            <div id="questionscreen" class="questioncontainer screen">
                <h2 id="Question"></h2>
                <div class="QSholder">
                    <p>
                        Question <span id="qnum"></span> of
                        <span id="numq"></span>
                    </p>
                    <p>Score: <span id="score">0</span></p>
                </div>
                <div id="answers" class="answers"></div>
                <div class="progressbar">
                    <div id="progress" class="progress"></div>
                </div>
            </div>
            <div id="resultscreen" class="rescontainer screen">
                <h2>Quiz Results</h2>
                <div class="resdiv">
                    <p>
                        You scored <span id="res_score"></span> out of
                        <span id="res_numq">.</span>
                    </p>
                    <h3 id="res_statement">Good job!</h3>
                </div>
                <button id="restartbtn">Restart Quiz</button>
            </div>
        </div>
    </body>
</html>
